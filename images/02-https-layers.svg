  <path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
<marker id="a-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4aa3ff"/></marker>
<marker id="a-s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker>
<marker id="a-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3c0"/></marker>
<marker id="a-y" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
<marker id="a-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3e635"/></marker>
<marker id="a-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker>
<marker id="a-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
<marker id="a-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker>
</defs>
<rect width="1200" height="675" rx="24" fill="url(#bg)"/>
<text x="48" y="64" class="h1" text-anchor="start" >HTTPS = HTTP inside TLS</text><text x="48" y="96" class="sub" text-anchor="start" >TLS encrypts on the way out and decrypts on the way in. HTTP never notices.</text><use href="#i-browser" x="198" y="120" width="64" height="48" style="color:#4aa3ff" /><text x="260" y="200" class="h2" text-anchor="middle" style="fill:#4aa3ff" >Browser</text><rect x="90" y="222" width="340" height="70" rx="12" fill="#0f2343" stroke="#4aa3ff" stroke-width="1.5" /><text x="112" y="254" class="h2" text-anchor="start" style="fill:#4aa3ff" >HTTP</text><text x="112" y="277" class="xs mono" text-anchor="start" style="fill:#8fa3c0" >GET /login  password=Sup3rS3cret!</text><rect x="90" y="308" width="340" height="70" rx="12" fill="#1d2a3f" stroke="#fbbf24" stroke-width="3" /><text x="112" y="340" class="h2" text-anchor="start" style="fill:#fbbf24" >TLS</text><text x="112" y="363" class="xs mono" text-anchor="start" style="fill:#8fa3c0" >encrypt / decrypt  (record protection)</text><use href="#i-lock" x="390" y="324" width="22" height="28" style="color:#fbbf24" /><rect x="90" y="394" width="340" height="70" rx="12" fill="#0f2343" stroke="#8fa3c0" stroke-width="1.5" /><text x="112" y="426" class="h2" text-anchor="start" style="fill:#8fa3c0" >TCP</text><text x="112" y="449" class="xs mono" text-anchor="start" style="fill:#8fa3c0" >reliable, ordered delivery</text><rect x="90" y="480" width="340" height="70" rx="12" fill="#0f2343" stroke="#8fa3c0" stroke-width="1.5" /><text x="112" y="512" class="h2" text-anchor="start" style="fill:#8fa3c0" >IP</text><text x="112" y="535" class="xs mono" text-anchor="start" style="fill:#8fa3c0" >routing across networks</text><use href="#i-server" x="884" y="120" width="52" height="56" style="color:#2dd4bf" /><text x="940" y="200" class="h2" text-anchor="middle" style="fill:#2dd4bf" >Bank server</text><rect x="770" y="222" width="340" height="70" rx="12" fill="#0f2343" stroke="#4aa3ff" stroke-width="1.5" /><text x="792" y="254" class="h2" text-anchor="start" style="fill:#4aa3ff" >HTTP</text><text x="792" y="277" class="xs mono" text-anchor="start" style="fill:#8fa3c0" >GET /login  password=Sup3rS3cret!</text><rect x="770" y="308" width="340" height="70" rx="12" fill="#1d2a3f" stroke="#fbbf24" stroke-width="3" /><text x="792" y="340" class="h2" text-anchor="start" style="fill:#fbbf24" >TLS</text><text x="792" y="363" class="xs mono" text-anchor="start" style="fill:#8fa3c0" >encrypt / decrypt  (record protection)</text><use href="#i-lock" x="1070" y="324" width="22" height="28" style="color:#fbbf24" /><rect x="770" y="394" width="340" height="70" rx="12" fill="#0f2343" stroke="#8fa3c0" stroke-width="1.5" /><text x="792" y="426" class="h2" text-anchor="start" style="fill:#8fa3c0" >TCP</text><text x="792" y="449" class="xs mono" text-anchor="start" style="fill:#8fa3c0" >reliable, ordered delivery</text><rect x="770" y="480" width="340" height="70" rx="12" fill="#0f2343" stroke="#8fa3c0" stroke-width="1.5" /><text x="792" y="512" class="h2" text-anchor="start" style="fill:#8fa3c0" >IP</text><text x="792" y="535" class="xs mono" text-anchor="start" style="fill:#8fa3c0" >routing across networks</text><path d="M70 250 V560 Q70 610 120 610 H1080 Q1130 610 1130 560 V250" fill="none" stroke="#2f4c7a" stroke-width="3" marker-end="url(#a-m)"/><text x="600" y="600" class="sm" text-anchor="middle" style="fill:#8fa3c0" >Internet: only ciphertext travels here</text><rect x="468" y="236" width="264" height="96" rx="12" fill="#0d1d38" stroke="#4aa3ff" stroke-width="1.5" /><text x="600" y="264" class="sm b" text-anchor="middle" style="fill:#4aa3ff" >Plain text</text><text x="600" y="288" class="xs" text-anchor="middle" style="fill:#8fa3c0" >exists only inside</text><text x="600" y="308" class="xs" text-anchor="middle" style="fill:#8fa3c0" >the browser and the server</text><rect x="468" y="352" width="264" height="96" rx="12" fill="#1d2a3f" stroke="#fbbf24" stroke-width="1.5" /><text x="600" y="380" class="sm b" text-anchor="middle" style="fill:#fbbf24" >TLS does the crypto</text><text x="600" y="404" class="xs" text-anchor="middle" style="fill:#8fa3c0" >HTTPS hands the data to TLS,</text><text x="600" y="424" class="xs" text-anchor="middle" style="fill:#8fa3c0" >TLS hands it back decrypted</text><text x="600" y="650" class="xs" text-anchor="middle" style="fill:#8fa3c0" >SSL is the old name: SSL 3.0 was replaced by TLS 1.0 in 1999. Today's versions are TLS 1.2 and TLS 1.3.</text>
</svg>
