<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="t d">
<title id="t">TLS 1.3 handshake</title>
<desc id="d">Animated sequence diagram: ClientHello with key share, ServerHello with key share, both derive handshake keys, the server sends encrypted extensions, certificate, certificate verify and finished, the browser verifies them and sends finished, then both derive session keys and exchange encrypted application data.</desc>
<style>
text{font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#e6edf7}
.mono{font-family:'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace}
.muted{fill:#8fa3c0}
.h1{font-size:34px;font-weight:700}
.sub{font-size:18px;fill:#8fa3c0}
.h2{font-size:20px;font-weight:600}
.lbl{font-size:16px}
.sm{font-size:14px}
.xs{font-size:12.5px}
.b{font-weight:700}
@keyframes s1{0%,2%{opacity:0;transform:translate(0,10px)}8%,95%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
.s1{animation:s1 18s infinite}
@keyframes s2{0%,12%{opacity:0;transform:translate(0,10px)}18%,95%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
.s2{animation:s2 18s infinite}
@keyframes s3{0%,21%{opacity:0;transform:translate(0,10px)}25%,95%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
.s3{animation:s3 18s infinite}
@keyframes s4{0%,28%{opacity:0;transform:translate(0,10px)}36%,95%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
.s4{animation:s4 18s infinite}
@keyframes s5{0%,40%{opacity:0;transform:translate(0,10px)}47%,95%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
.s5{animation:s5 18s infinite}
@keyframes s6{0%,51%{opacity:0;transform:translate(0,10px)}57%,95%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
.s6{animation:s6 18s infinite}
@keyframes s7{0%,60%{opacity:0;transform:translate(0,10px)}64%,95%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
.s7{animation:s7 18s infinite}
@keyframes s8{0%,68%{opacity:0;transform:translate(0,10px)}75%,95%{opacity:1;transform:translate(0,0)}100%{opacity:0}}
.s8{animation:s8 18s infinite}

@media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0b1730"/><stop offset="1" stop-color="#132a50"/>
</linearGradient>
<symbol id="i-browser" viewBox="0 0 64 48">
  <rect x="2" y="2" width="60" height="44" rx="6" fill="#132c52" stroke="currentColor" stroke-width="3"/>
  <line x1="2" y1="14" x2="62" y2="14" stroke="currentColor" stroke-width="3"/>
  <circle cx="10" cy="8" r="2.2" fill="currentColor"/><circle cx="17" cy="8" r="2.2" fill="currentColor"/><circle cx="24" cy="8" r="2.2" fill="currentColor"/>
  <rect x="12" y="22" width="40" height="8" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="12" y="34" width="24" height="6" rx="3" fill="currentColor" opacity=".6"/>
</symbol>
<symbol id="i-server" viewBox="0 0 48 64">
  <g fill="#132c52" stroke="currentColor" stroke-width="3">
    <rect x="2" y="2" width="44" height="18" rx="4"/><rect x="2" y="23" width="44" height="18" rx="4"/><rect x="2" y="44" width="44" height="18" rx="4"/>
  </g>
  <g fill="currentColor">
    <circle cx="11" cy="11" r="2.5"/><circle cx="11" cy="32" r="2.5"/><circle cx="11" cy="53" r="2.5"/>
    <rect x="20" y="9.5" width="18" height="3" rx="1.5"/><rect x="20" y="30.5" width="18" height="3" rx="1.5"/><rect x="20" y="51.5" width="18" height="3" rx="1.5"/>
  </g>
</symbol>
<symbol id="i-router" viewBox="0 0 64 44">
  <line x1="16" y1="18" x2="10" y2="3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="18" x2="54" y2="3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <rect x="2" y="18" width="60" height="24" rx="6" fill="#132c52" stroke="currentColor" stroke-width="3"/>
  <g fill="currentColor"><circle cx="14" cy="30" r="2.5"/><circle cx="23" cy="30" r="2.5"/><circle cx="32" cy="30" r="2.5"/></g>
</symbol>
<symbol id="i-cloud" viewBox="0 0 72 46">
  <path d="M18 43h37a14 14 0 0 0 2-28 20 20 0 0 0-38-3A15.5 15.5 0 0 0 18 43z" fill="#132c52" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
</symbol>
<symbol id="i-eye" viewBox="0 0 56 32">
  <path d="M2 16C12 3 44 3 54 16 44 29 12 29 2 16z" fill="#2a0f1a" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="28" cy="16" r="8" fill="currentColor"/><circle cx="28" cy="16" r="3.5" fill="#0b1730"/>
</symbol>
<symbol id="i-key" viewBox="0 0 64 28">
  <circle cx="14" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="5"/>
  <rect x="23" y="11" width="39" height="6" rx="2" fill="currentColor"/>
  <rect x="45" y="16" width="5" height="9" rx="1" fill="currentColor"/><rect x="54" y="16" width="5" height="7" rx="1" fill="currentColor"/>
</symbol>
<symbol id="i-lock" viewBox="0 0 32 40">
  <path d="M8 18V12a8 8 0 0 1 16 0v6" fill="none" stroke="currentColor" stroke-width="4"/>
  <rect x="3" y="18" width="26" height="20" rx="4" fill="currentColor"/>
  <circle cx="16" cy="26.5" r="3" fill="#0b1730"/><rect x="14.5" y="27" width="3" height="6" fill="#0b1730"/>
</symbol>
<symbol id="i-unlock" viewBox="0 0 32 40">
  <path d="M8 18V12a8 8 0 0 1 15.5-2.8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <rect x="3" y="18" width="26" height="20" rx="4" fill="currentColor"/>
  <circle cx="16" cy="26.5" r="3" fill="#0b1730"/><rect x="14.5" y="27" width="3" height="6" fill="#0b1730"/>
</symbol>
<symbol id="i-cert" viewBox="0 0 48 58">
  <rect x="2" y="2" width="44" height="40" rx="4" fill="#132c52" stroke="currentColor" stroke-width="3"/>
  <g fill="currentColor"><rect x="9" y="10" width="30" height="3" rx="1.5"/><rect x="9" y="17" width="22" height="3" rx="1.5"/><rect x="9" y="24" width="26" height="3" rx="1.5"/></g>
  <circle cx="34" cy="40" r="8" fill="currentColor"/>
  <path d="M29 46l-3 11 8-4 8 4-3-11" fill="currentColor"/>
</symbol>
<symbol id="i-check" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="11" fill="currentColor" opacity=".18"/>
  <path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
<marker id="a-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4aa3ff"/></marker>
<marker id="a-s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker>
<marker id="a-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3c0"/></marker>
<marker id="a-y" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
<marker id="a-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3e635"/></marker>
<marker id="a-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker>
<marker id="a-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
<marker id="a-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker>
</defs>
<rect width="1080" height="1080" rx="24" fill="url(#bg)"/>
<text x="48" y="64" class="h1" text-anchor="start" >TLS 1.3 handshake: one round trip</text><text x="48" y="96" class="sub" text-anchor="start" >Agree on keys, prove who the server is, then switch to fast symmetric encryption</text><use href="#i-browser" x="136" y="112" width="68" height="51" style="color:#4aa3ff" /><text x="170" y="188" class="h2" text-anchor="middle" style="fill:#4aa3ff" >Browser</text><use href="#i-server" x="888" y="108" width="44" height="59" style="color:#2dd4bf" /><text x="910" y="188" class="h2" text-anchor="middle" style="fill:#2dd4bf" >www.bank.example</text><line x1="170" y1="200" x2="170" y2="1000" stroke="#4aa3ff" stroke-width="2" stroke-opacity=".45"/><line x1="910" y1="200" x2="910" y2="1000" stroke="#2dd4bf" stroke-width="2" stroke-opacity=".45"/><g class="s1"><rect x="260.0" y="210" width="560" height="50" rx="10" fill="#0f2343" stroke="#4aa3ff" stroke-width="1.5" /><text x="540" y="232" class="lbl b mono" text-anchor="middle" style="fill:#4aa3ff" >ClientHello</text><text x="540" y="252" class="xs" text-anchor="middle" style="fill:#8fa3c0" >random · cipher suites · key_share = public A · server name</text><line x1="178" y1="270" x2="898" y2="270" stroke="#4aa3ff" stroke-width="3" marker-end="url(#a-c)"/></g><g class="s2"><rect x="260.0" y="290" width="560" height="50" rx="10" fill="#0f2343" stroke="#2dd4bf" stroke-width="1.5" /><text x="540" y="312" class="lbl b mono" text-anchor="middle" style="fill:#2dd4bf" >ServerHello</text><text x="540" y="332" class="xs" text-anchor="middle" style="fill:#8fa3c0" >random · chosen suite (TLS_AES_128_GCM_SHA256) · key_share = public B</text><line x1="902" y1="350" x2="182" y2="350" stroke="#2dd4bf" stroke-width="3" marker-end="url(#a-s)"/></g><path d="M1000 222 q14 0 14 14 v106 q0 14 -14 14" fill="none" stroke="#8fa3c0" stroke-width="2"/><text x="1024" y="294" class="lbl b" text-anchor="start" style="fill:#8fa3c0" >1</text><text x="1020" y="314" class="xs" text-anchor="start" style="fill:#8fa3c0" >RTT</text><g class="s3"><rect x="65" y="375" width="210" height="36" rx="18" fill="#2b230c" stroke="#fbbf24" stroke-width="1.5" /><use href="#i-key" x="78" y="384" width="40" height="18" style="color:#fbbf24" /><text x="130" y="398" class="sm b" text-anchor="start" style="fill:#fbbf24" >handshake keys</text><rect x="805" y="375" width="210" height="36" rx="18" fill="#2b230c" stroke="#fbbf24" stroke-width="1.5" /><use href="#i-key" x="818" y="384" width="40" height="18" style="color:#fbbf24" /><text x="870" y="398" class="sm b" text-anchor="start" style="fill:#fbbf24" >handshake keys</text><text x="540" y="398" class="sm" text-anchor="middle" style="fill:#fbbf24" >both compute ECDHE: a·B = b·A</text></g><g class="s4"><rect x="250" y="428" width="580" height="208" rx="12" fill="#1d2a3f" stroke="#fbbf24" stroke-width="2" /><use href="#i-lock" x="266" y="440" width="18" height="22" style="color:#fbbf24" /><text x="292" y="457" class="xs" text-anchor="start" style="fill:#fbbf24" >encrypted with the handshake keys</text><text x="272" y="488" class="sm b mono" text-anchor="start" style="fill:#2dd4bf" >{EncryptedExtensions}</text><text x="272" y="505" class="xs" text-anchor="start" style="fill:#8fa3c0" >extra settings, now hidden from observers</text><text x="272" y="526" class="sm b mono" text-anchor="start" style="fill:#2dd4bf" >{Certificate}</text><text x="272" y="543" class="xs" text-anchor="start" style="fill:#8fa3c0" >"this is who I am" + public key, signed by a CA</text><text x="272" y="564" class="sm b mono" text-anchor="start" style="fill:#2dd4bf" >{CertificateVerify}</text><text x="272" y="581" class="xs" text-anchor="start" style="fill:#8fa3c0" >signature over the handshake with the private key</text><text x="272" y="602" class="sm b mono" text-anchor="start" style="fill:#2dd4bf" >{Finished}</text><text x="272" y="619" class="xs" text-anchor="start" style="fill:#8fa3c0" >MAC over everything so far: nothing was tampered with</text><line x1="902" y1="656" x2="182" y2="656" stroke="#2dd4bf" stroke-width="3" marker-end="url(#a-s)"/></g><g class="s5"><rect x="190" y="678" width="420" height="124" rx="12" fill="#0f2a22" stroke="#22c55e" stroke-width="1.5" /><text x="208" y="702" class="sm b" text-anchor="start" style="fill:#22c55e" >Browser verifies</text><use href="#i-check" x="208" y="712" width="18" height="18" style="color:#22c55e" /><text x="234" y="726" class="sm" text-anchor="start" >chain ends at a trusted root CA</text><use href="#i-check" x="208" y="734" width="18" height="18" style="color:#22c55e" /><text x="234" y="748" class="sm" text-anchor="start" >name matches www.bank.example</text><use href="#i-check" x="208" y="756" width="18" height="18" style="color:#22c55e" /><text x="234" y="770" class="sm" text-anchor="start" >signature proves the private key</text><use href="#i-check" x="208" y="778" width="18" height="18" style="color:#22c55e" /><text x="234" y="792" class="sm" text-anchor="start" >server Finished MAC is correct</text></g><g class="s6"><rect x="330.0" y="812" width="420" height="50" rx="10" fill="#0f2343" stroke="#4aa3ff" stroke-width="1.5" /><text x="540" y="834" class="lbl b mono" text-anchor="middle" style="fill:#4aa3ff" >{Finished}</text><text x="540" y="854" class="xs" text-anchor="middle" style="fill:#8fa3c0" >the browser confirms it saw the same handshake</text><line x1="178" y1="872" x2="898" y2="872" stroke="#4aa3ff" stroke-width="3" marker-end="url(#a-c)"/></g><g class="s7"><rect x="65" y="896" width="210" height="36" rx="18" fill="#2b230c" stroke="#fbbf24" stroke-width="1.5" /><use href="#i-key" x="78" y="905" width="40" height="18" style="color:#fbbf24" /><text x="130" y="919" class="sm b" text-anchor="start" style="fill:#fbbf24" >session keys</text><rect x="805" y="896" width="210" height="36" rx="18" fill="#2b230c" stroke="#fbbf24" stroke-width="1.5" /><use href="#i-key" x="818" y="905" width="40" height="18" style="color:#fbbf24" /><text x="870" y="919" class="sm b" text-anchor="start" style="fill:#fbbf24" >session keys</text><text x="540" y="919" class="xs" text-anchor="middle" style="fill:#fbbf24" >same secret + full transcript</text></g><g class="s8"><rect x="300" y="944" width="480" height="40" rx="20" fill="#2b230c" stroke="#fbbf24" stroke-width="2" /><use href="#i-lock" x="318" y="953" width="18" height="22" style="color:#fbbf24" /><text x="552" y="970" class="sm b mono" text-anchor="middle" style="fill:#fbbf24" >[Application Data]  password, pages, images</text><line x1="182" y1="1002" x2="898" y2="1002" stroke="#fbbf24" stroke-width="3" marker-start="url(#a-y)" marker-end="url(#a-y)"/></g><text x="300" y="1048" class="xs mono" text-anchor="middle" style="fill:#8fa3c0" >{ }  encrypted with handshake keys</text><text x="770" y="1048" class="xs mono" text-anchor="middle" style="fill:#8fa3c0" >[ ]  encrypted with session keys (AES-GCM)</text>
</svg>
