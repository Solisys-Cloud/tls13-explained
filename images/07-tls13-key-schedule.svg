<rect width="1200" height="720" rx="24" fill="url(#bg)"/>
<text x="48" y="64" class="h1" text-anchor="start" >From one shared secret to many keys</text><text x="48" y="96" class="sub" text-anchor="start" >The TLS 1.3 key schedule (simplified): one-way derivations, separate keys per phase and per direction</text><rect x="48" y="140" width="220" height="60" rx="10" fill="#0f2343" stroke="#8fa3c0" stroke-width="2" /><text x="158.0" y="168.0" class="sm b" text-anchor="middle" style="fill:#8fa3c0" >Early Secret</text><text x="158.0" y="188.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >no pre-shared key: zeros</text><rect x="48" y="260" width="220" height="70" rx="10" fill="#2b230c" stroke="#fbbf24" stroke-width="2" /><text x="158.0" y="293.0" class="sm b" text-anchor="middle" style="fill:#fbbf24" >ECDHE shared secret</text><text x="158.0" y="313.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >a·B = b·A</text><rect x="318" y="260" width="150" height="70" rx="10" fill="#0f2343" stroke="#8fa3c0" stroke-width="2" /><text x="393.0" y="301.0" class="sm b" text-anchor="middle" style="fill:#8fa3c0" >HKDF-Extract</text><rect x="518" y="260" width="190" height="70" rx="10" fill="#2b230c" stroke="#fbbf24" stroke-width="2" /><text x="613.0" y="301.0" class="sm b" text-anchor="middle" style="fill:#fbbf24" >Handshake Secret</text><rect x="758" y="210" width="190" height="70" rx="10" fill="#0f2343" stroke="#4aa3ff" stroke-width="2" /><text x="853.0" y="243.0" class="sm b" text-anchor="middle" style="fill:#4aa3ff" >client hs traffic</text><text x="853.0" y="263.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >secret</text><rect x="758" y="310" width="190" height="70" rx="10" fill="#0f2343" stroke="#2dd4bf" stroke-width="2" /><text x="853.0" y="343.0" class="sm b" text-anchor="middle" style="fill:#2dd4bf" >server hs traffic</text><text x="853.0" y="363.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >secret</text><rect x="998" y="210" width="160" height="70" rx="10" fill="#0f2343" stroke="#4aa3ff" stroke-width="2" /><text x="1078.0" y="243.0" class="sm b" text-anchor="middle" style="fill:#4aa3ff" >key + IV</text><text x="1078.0" y="263.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >client → server { }</text><rect x="998" y="310" width="160" height="70" rx="10" fill="#0f2343" stroke="#2dd4bf" stroke-width="2" /><text x="1078.0" y="343.0" class="sm b" text-anchor="middle" style="fill:#2dd4bf" >key + IV</text><text x="1078.0" y="363.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >server → client { }</text><path d="M268 295 L316 295" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#a-y)"/><path d="M468 295 L516 295" stroke="#8fa3c0" stroke-width="2" fill="none" marker-end="url(#a-m)"/><path d="M158 200 V230 H393 V258" stroke="#8fa3c0" stroke-width="2" fill="none" marker-end="url(#a-m)"/><text x="276" y="224" class="xs" text-anchor="middle" style="fill:#8fa3c0" >"derived" = salt</text><path d="M708 285 L756 245" stroke="#8fa3c0" stroke-width="2" fill="none" marker-end="url(#a-m)"/><path d="M708 305 L756 345" stroke="#8fa3c0" stroke-width="2" fill="none" marker-end="url(#a-m)"/><path d="M948 245 L996 245" stroke="#4aa3ff" stroke-width="2" fill="none" marker-end="url(#a-c)"/><path d="M948 345 L996 345" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#a-s)"/><text x="853" y="402" class="xs" text-anchor="middle" style="fill:#8fa3c0" >+ transcript hash (ClientHello … ServerHello)</text><rect x="318" y="500" width="150" height="70" rx="10" fill="#0f2343" stroke="#8fa3c0" stroke-width="2" /><text x="393.0" y="533.0" class="sm b" text-anchor="middle" style="fill:#8fa3c0" >HKDF-Extract</text><text x="393.0" y="553.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >input = zeros</text><rect x="518" y="500" width="190" height="70" rx="10" fill="#2b230c" stroke="#fbbf24" stroke-width="2" /><text x="613.0" y="541.0" class="sm b" text-anchor="middle" style="fill:#fbbf24" >Master Secret</text><rect x="758" y="450" width="190" height="70" rx="10" fill="#0f2343" stroke="#4aa3ff" stroke-width="2" /><text x="853.0" y="483.0" class="sm b" text-anchor="middle" style="fill:#4aa3ff" >client app traffic</text><text x="853.0" y="503.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >secret</text><rect x="758" y="550" width="190" height="70" rx="10" fill="#0f2343" stroke="#2dd4bf" stroke-width="2" /><text x="853.0" y="583.0" class="sm b" text-anchor="middle" style="fill:#2dd4bf" >server app traffic</text><text x="853.0" y="603.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >secret</text><rect x="998" y="450" width="160" height="70" rx="10" fill="#0f2343" stroke="#4aa3ff" stroke-width="2" /><text x="1078.0" y="483.0" class="sm b" text-anchor="middle" style="fill:#4aa3ff" >session key + IV</text><text x="1078.0" y="503.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >client → server [ ]</text><rect x="998" y="550" width="160" height="70" rx="10" fill="#0f2343" stroke="#2dd4bf" stroke-width="2" /><text x="1078.0" y="583.0" class="sm b" text-anchor="middle" style="fill:#2dd4bf" >session key + IV</text><text x="1078.0" y="603.0" class="xs" text-anchor="middle" style="fill:#8fa3c0" >server → client [ ]</text><path d="M613 330 V370 H393 V498" stroke="#8fa3c0" stroke-width="2" fill="none" marker-end="url(#a-m)"/><text x="500" y="388" class="xs" text-anchor="middle" style="fill:#8fa3c0" >"derived" = salt</text><path d="M468 535 L516 535" stroke="#8fa3c0" stroke-width="2" fill="none" marker-end="url(#a-m)"/><path d="M708 525 L756 485" stroke="#8fa3c0" stroke-width="2" fill="none" marker-end="url(#a-m)"/><path d="M708 545 L756 585" stroke="#8fa3c0" stroke-width="2" fill="none" marker-end="url(#a-m)"/><path d="M948 485 L996 485" stroke="#4aa3ff" stroke-width="2" fill="none" marker-end="url(#a-c)"/><path d="M948 585 L996 585" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#a-s)"/><text x="853" y="642" class="xs" text-anchor="middle" style="fill:#8fa3c0" >+ transcript hash (ClientHello … server Finished)</text><rect x="48" y="400" width="240" height="150" rx="12" fill="#0f2343" stroke="#2f4c7a" stroke-width="1.5" /><text x="64" y="426" class="sm b" text-anchor="start" >Why it matters</text><text x="64" y="450" class="xs" text-anchor="start" style="fill:#8fa3c0" >Each key is derived one way:</text><text x="64" y="470" class="xs" text-anchor="start" style="fill:#8fa3c0" >leaking one key does not</text><text x="64" y="490" class="xs" text-anchor="start" style="fill:#8fa3c0" >reveal the secret behind it.</text><text x="64" y="510" class="xs" text-anchor="start" style="fill:#8fa3c0" >Transcript hash binds keys</text><text x="64" y="530" class="xs" text-anchor="start" style="fill:#8fa3c0" >to this exact handshake.</text><text x="600" y="690" class="xs" text-anchor="middle" style="fill:#8fa3c0" >HKDF = HMAC-based Key Derivation Function (RFC 5869). Exact labels: RFC 8446 section 7.1. Byte-level walkthrough: tls13.xargs.org</text>
</svg>
