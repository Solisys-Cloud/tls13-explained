<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
<title id="t">TLS 1.3 key schedule</title>
<desc id="d">The ECDHE shared secret goes through HKDF-Extract to give the handshake secret, which yields client and server handshake traffic secrets and keys. A second extraction gives the master secret, which yields client and server application traffic secrets and the session keys.</desc>
